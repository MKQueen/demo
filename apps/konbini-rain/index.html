<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="dark" />
  <title>雨夜小镇 · RAINY TOWN · 44×44</title>
  <meta name="description" content="一座 44×44 的日式小镇：雨夜/晴日双模式、全景/街景双视角；十字街、商店街、住宅、大校园、神社、医院、车站与河流，三渲二 + 湿路反射 + 电车/行人/灯笼动效。" />
  <meta name="theme-color" content="#05070f" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23070b16'/%3E%3Cpath d='M21 8a9 9 0 1 0 0 16 10.5 10.5 0 0 1 0-16Z' fill='%23ffd28a'/%3E%3Ccircle cx='10' cy='10' r='1.2' fill='%2388e6dc'/%3E%3C/svg%3E" />
</head>
<body>
  <canvas id="scene" aria-label="雨夜/晴日 日式小镇：拖拽旋转、滚轮或双指缩放；可切换全景与街景"></canvas>
  <div class="town-ui" id="town-ui" aria-label="场景控制">
    <div class="ui-row">
      <span class="ui-label">天气</span>
      <div class="ui-seg" role="group" aria-label="天气">
        <button type="button" data-mode="night" class="active">雨夜</button>
        <button type="button" data-mode="day">晴日</button>
      </div>
    </div>
    <div class="ui-row">
      <span class="ui-label">视角</span>
      <div class="ui-seg" role="group" aria-label="视角">
        <button type="button" data-view="hero" class="active">全景</button>
        <button type="button" data-view="street">街景</button>
      </div>
    </div>
  </div>
  <div class="town-hint" id="town-hint">拖拽旋转 · 滚轮缩放</div>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
