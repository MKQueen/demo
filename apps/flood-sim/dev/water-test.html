<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>水面 Shader 独立测试页 · flood-sim</title>
    <!-- Cesium 的 widget 样式（本地 public/cesium，无网络请求）；缺了它 canvas 只有 300x150 -->
    <link rel="stylesheet" href="../cesium/Widgets/widgets.css" />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #05090f;
        color: #cfe8ee;
        font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      }
      #cesiumContainer {
        position: absolute;
        inset: 0;
      }
      .cesium-viewer,
      .cesium-viewer-cesiumWidgetContainer,
      .cesium-widget,
      .cesium-widget canvas {
        width: 100% !important;
        height: 100% !important;
      }
      #hud {
        position: absolute;
        left: 12px;
        top: 12px;
        z-index: 10;
        padding: 8px 12px;
        border-radius: 8px;
        background: rgba(5, 16, 24, 0.62);
        border: 1px solid rgba(90, 200, 220, 0.28);
        color: #bfe9f2;
        pointer-events: none;
        white-space: pre;
      }
      #hud b {
        color: #ffcf7d;
        font-weight: 600;
      }
      .cesium-widget-credits {
        display: none !important;
      }
    </style>
    <script>
      // 与 index.html 一致：Cesium 静态资源走 public/cesium（本地，无网络请求）
      window.CESIUM_BASE_URL = new URL('../cesium/', document.baseURI).href;
    </script>
  </head>
  <body>
    <div id="cesiumContainer"></div>
    <div id="hud">水面 Shader 测试页加载中…</div>
    <script type="module" src="./water-test.js"></script>
  </body>
</html>
