<head>

  }
  #title span { display: block; font-weight: 400; font-size: 12px; opacity: 0.75; margin-top: 2px; }
  #status {
    position: absolute; right: 18px; top: 18px; max-width: 46vw; padding: 6px 10px;
    background: rgba(255,255,255,0.78); border: 2px solid #2f3a3a; border-radius: 8px;
