name: Deploy static site to GitHub Pages

# 手动兜底工作流：重新构建并发布 Pages。
# 日常部署走 gh-pages 分支（根目录 `npm run deploy:gh-pages -- --skip-build`），
# 这样不需要在 CI 里重新安装 12 个 demo 的依赖。
# 使用本工作流前，把 Settings → Pages → Source 改成 "GitHub Actions"。

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      # build-all 会按需为每个 app 执行 npm install / npm run build，
      # 再把产物拼装成 site/（不需要提交 node_modules 与构建产物）。
      - name: Build all demos
        run: node scripts/build-all.mjs

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    name: Deploy site
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
